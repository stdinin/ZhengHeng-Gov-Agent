services:
  mongo:
    # MongoDB's official Quay image avoids the locally corrupted Docker Hub layer cache.
    image: quay.io/mongodb/mongodb-community-server:7.0-ubi9-slim
    # Publish/archival operations are atomic transactions, which require a
    # replica set even in the one-node local development topology.
    # The image entrypoint already appends --bind_ip_all.
    command: ["mongod", "--replSet", "rs0"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  mongo-init:
    # Keep the replica-set bootstrap declarative so a fresh named volume is
    # usable without a manual docker exec step.  `localhost` is deliberate:
    # this Compose stack is consumed by the host-native API and test runner.
    image: quay.io/mongodb/mongodb-community-server:7.0-ubi9-slim
    depends_on:
      mongo:
        condition: service_started
    restart: "no"
    command:
      - bash
      - -lc
      - >-
        until mongosh --host mongo --quiet --eval "if (!db.adminCommand({ping: 1}).ok) quit(1)"; do sleep 1; done;
        mongosh --host mongo --quiet --eval "try { rs.status().ok } catch (error) { if (error.code === 94) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}) } else { throw error } }";
        until mongosh --host mongo --quiet --eval "if (!db.hello().isWritablePrimary) quit(1)"; do sleep 1; done

  redis:
    # Public ECR mirror, verified to match docker.io/redis:7.4-alpine by digest.
    image: public.ecr.aws/docker/library/redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  opensearch:
    # Official ECR image. 2.18.0 is a separately verified executable layer set.
    image: public.ecr.aws/opensearchproject/opensearch:2.18.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      # Required by OpenSearch 2.12+ demo bootstrap even when security is disabled.
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?set OPENSEARCH_INITIAL_ADMIN_PASSWORD in .env}
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9201:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 10s
      retries: 20

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    command: etcd -advertise-client-urls=http://0.0.0.0:2379 -listen-client-urls=http://0.0.0.0:2379
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    # Keep this aligned with Milvus's tested standalone Compose dependency.
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    command: minio server /minio_data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  milvus:
    # v2.6.25's Milvus server and tini binaries were verified executable locally.
    image: zhengheng-milvus:2.6.25-healthfix
    build:
      context: .
      dockerfile: deploy/docker/milvus/Dockerfile
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-q", "--spider", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 20

  # V1.1 is opt-in. `docker compose up` keeps the existing V1.0 data-plane
  # topology unchanged; use `--profile multi-agent` to start these services.
  pi-runtime:
    profiles: ["multi-agent"]
    image: zhengheng-pi-runtime:v1.1
    build:
      context: ./services/pi-runtime
    environment:
      PI_INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env}
      PI_RUNTIME_MODE: faux
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:8090/internal/health/ready',{headers:{'X-Internal-Service-Token':process.env.PI_INTERNAL_SERVICE_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  orchestrator:
    profiles: ["multi-agent"]
    image: zhengheng-backend:v1.1
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    environment: &multi_agent_backend_environment
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      MONGO_URI: mongodb://host.docker.internal:27017/?directConnection=true
      MONGO_DB: ${MONGO_DB:-zhengheng}
      REDIS_URL: redis://host.docker.internal:6379/0
      OPENSEARCH_URL: http://host.docker.internal:9201
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-policy_chunks}
      MILVUS_HOST: host.docker.internal
      MILVUS_PORT: "19530"
      # Leave this unset by default so MilvusDenseIndex derives the collection
      # name from the configured embedding model and dimension.  A fixed
      # policy_chunks name is incompatible with V1.0's versioned BGE-M3
      # collection and would make a healthy Milvus look empty at runtime.
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env}
      SERVICE_ROLE: orchestrator
      AGENT_ID: orchestrator
      AGENT_EXECUTION_MODE: multi
      MULTI_AGENT_ENABLED: "true"
      AGENT_RUNTIME_BACKEND: pi
      AGENT_RUNTIME_FALLBACK: fake
      PI_RUNTIME_BASE_URL: http://pi-runtime:8090
      PI_RUNTIME_TIMEOUT_MS: "20000"
      PI_RUNTIME_CONNECT_TIMEOUT_MS: "3000"
      DEPARTMENT_AGENT_TAX_URL: http://department-agent-tax:8000
      DEPARTMENT_AGENT_HRSS_URL: http://department-agent-hrss:8000
      DEPARTMENT_AGENT_HOUSING_URL: http://department-agent-housing:8000
      ORCHESTRATOR_MAX_PARALLEL: ${ORCHESTRATOR_MAX_PARALLEL:-3}
      MULTI_AGENT_MAX_DEPARTMENTS: ${MULTI_AGENT_MAX_DEPARTMENTS:-3}
      # A local BGE-M3 retrieval can exceed the library default on CPU-only
      # hosts.  Keep a bounded 20s per-department deadline for the Compose
      # profile; callers can tighten it through the environment.
      DEPARTMENT_AGENT_TIMEOUT_MS: ${DEPARTMENT_AGENT_TIMEOUT_MS:-20000}
      EMBEDDING_MODE: ${EMBEDDING_MODE:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      RERANKER_ENABLED: ${RERANKER_ENABLED:-true}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${HF_CACHE_DIR:-./.cache/huggingface}:/root/.cache/huggingface
    ports:
      # The V1.0 observability profile may already use host 8000.
      - "8010:8000"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      milvus:
        condition: service_healthy
      pi-runtime:
        condition: service_healthy
      department-agent-tax:
        condition: service_healthy
      department-agent-hrss:
        condition: service_healthy
      department-agent-housing:
        condition: service_healthy
    healthcheck: &backend_live_healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  department-agent-tax:
    profiles: ["multi-agent"]
    image: zhengheng-backend:v1.1
    environment:
      <<: *multi_agent_backend_environment
      SERVICE_ROLE: department_agent
      AGENT_ID: tax-agent
      DEPT_ID: tax
      AGENT_EXECUTION_MODE: single
      MULTI_AGENT_ENABLED: "false"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${HF_CACHE_DIR:-./.cache/huggingface}:/root/.cache/huggingface
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      milvus:
        condition: service_healthy
      pi-runtime:
        condition: service_healthy
    healthcheck: *backend_live_healthcheck

  department-agent-hrss:
    profiles: ["multi-agent"]
    image: zhengheng-backend:v1.1
    environment:
      <<: *multi_agent_backend_environment
      SERVICE_ROLE: department_agent
      AGENT_ID: hrss-agent
      DEPT_ID: hrss
      AGENT_EXECUTION_MODE: single
      MULTI_AGENT_ENABLED: "false"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${HF_CACHE_DIR:-./.cache/huggingface}:/root/.cache/huggingface
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      milvus:
        condition: service_healthy
      pi-runtime:
        condition: service_healthy
    healthcheck: *backend_live_healthcheck

  department-agent-housing:
    profiles: ["multi-agent"]
    image: zhengheng-backend:v1.1
    environment:
      <<: *multi_agent_backend_environment
      SERVICE_ROLE: department_agent
      AGENT_ID: housing-agent
      DEPT_ID: housing
      AGENT_EXECUTION_MODE: single
      MULTI_AGENT_ENABLED: "false"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${HF_CACHE_DIR:-./.cache/huggingface}:/root/.cache/huggingface
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      milvus:
        condition: service_healthy
      pi-runtime:
        condition: service_healthy
    healthcheck: *backend_live_healthcheck

volumes:
  mongo_data:
  redis_data:
  opensearch_data:
  etcd_data:
  minio_data:
  milvus_data:
