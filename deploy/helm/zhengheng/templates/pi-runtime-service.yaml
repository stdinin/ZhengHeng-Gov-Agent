apiVersion: v1
kind: Service
metadata:
  name: {{ include "zhengheng.fullname" . }}-pi-runtime
  labels:
    {{- include "zhengheng.labels" . | nindent 4 }}
    app.kubernetes.io/component: pi-runtime
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: pi-runtime
  ports:
    - name: http
      port: {{ .Values.piRuntime.port }}
      targetPort: http
