[project]
name = "zhengheng-agent"
version = "0.1.0"
description = "可信、可治理的多部门政务 RAG Agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "pymongo>=4.11,<5.0",
    "redis>=5.2,<6.0",
    "opensearch-py>=2.7,<3.0",
    "pymilvus>=2.5,<3.0",
    "pyjwt>=2.10,<3.0",
    "bcrypt>=4.2,<5.0",
    "beautifulsoup4>=4.12,<5.0",
    "pymupdf>=1.25,<2.0",
    "python-docx>=1.1,<2.0",
    "httpx>=0.28,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "jieba>=0.42.1,<1.0",
    "sentence-transformers>=3.4,<4.0",
    "datasets>=4.0,<5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]
markers = [
    "integration: requires Docker Compose infrastructure",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["backend.app"]

[[tool.mypy.overrides]]
module = ["fitz", "pymilvus"]
ignore_missing_imports = true
