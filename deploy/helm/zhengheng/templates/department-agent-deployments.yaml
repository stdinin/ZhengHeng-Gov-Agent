{{- range $agent := .Values.agents }}
{{- if $agent.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zhengheng.agentName" (dict "root" $ "agent" $agent) }}
  labels:
    {{- include "zhengheng.labels" $ | nindent 4 }}
    app.kubernetes.io/component: department-agent
    zhengheng.ai/dept-id: {{ $agent.deptId | quote }}
spec:
  replicas: {{ $agent.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: department-agent
      zhengheng.ai/dept-id: {{ $agent.deptId | quote }}
  template:
    metadata:
      labels:
        {{- include "zhengheng.labels" $ | nindent 8 }}
        app.kubernetes.io/component: department-agent
        zhengheng.ai/dept-id: {{ $agent.deptId | quote }}
    spec:
      containers:
        - name: department-agent
          image: {{ $.Values.backend.image }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $.Values.backend.port }}
          envFrom:
            - configMapRef:
                name: {{ include "zhengheng.fullname" $ }}-config
          env:
            - name: SERVICE_ROLE
              value: department_agent
            - name: AGENT_EXECUTION_MODE
              value: single
            - name: MULTI_AGENT_ENABLED
              value: "false"
            - name: AGENT_ID
              value: {{ $agent.id | quote }}
            - name: DEPT_ID
              value: {{ $agent.deptId | quote }}
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: appSecret
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: internalServiceToken
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
          resources:
            {{- toYaml $.Values.backend.resources | nindent 12 }}
{{- end }}
{{- end }}
