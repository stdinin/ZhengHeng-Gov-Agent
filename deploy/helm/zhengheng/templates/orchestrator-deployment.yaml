apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zhengheng.fullname" . }}-orchestrator
  labels:
    {{- include "zhengheng.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  replicas: {{ .Values.orchestrator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: orchestrator
  template:
    metadata:
      labels:
        {{- include "zhengheng.labels" . | nindent 8 }}
        app.kubernetes.io/component: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: {{ .Values.backend.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          envFrom:
            - configMapRef:
                name: {{ include "zhengheng.fullname" . }}-config
          env:
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: appSecret
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: internalServiceToken
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
