apiVersion: v1
kind: Service
metadata:
  name: {{ include "zhengheng.fullname" . }}-orchestrator
  labels:
    {{- include "zhengheng.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: orchestrator
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
